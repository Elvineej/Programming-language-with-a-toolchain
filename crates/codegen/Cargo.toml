# Core -> LLVM -> object -> native binary. This is the ONLY crate that links
# `llvm_sys`; the vcpkg static LLVM 18 is bundled into a 3.73 GiB rlib, so
# keeping it out of the front end keeps `cargo test` off the link marathon.
[package]
name = "elya-codegen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "elya_codegen"
path = "src/lib.rs"

[dependencies]
elya = { path = "../.." }
inkwell = { version = "0.5", default-features = false, features = ["llvm18-0", "target-x86"] }

[features]
# Code for boards (specs 2026-11-13-elya-boards, 2026-11-14-elya-riscv-board):
# LLVM's ARM and RISC-V back ends, which the LLVM linked must have (the official
# releases do; a vcpkg x86-only one does not).
boards = ["inkwell/target-arm", "inkwell/target-riscv"]
