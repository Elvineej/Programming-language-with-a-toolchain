# The `elya` binary. Native codegen is optional here so the shipped compiler can
# still be built without LLVM: `--features codegen` pulls in `elya-codegen`.
[package]
name = "elya-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "elya"
path = "src/main.rs"

[dependencies]
elya = { path = "../.." }
elya-codegen = { path = "../codegen", optional = true }

[features]
codegen = ["dep:elya-codegen"]
# `elya build --target <board>` (spec 2026-11-14-elya-build-target): LLVM's ARM
# and RISC-V back ends, which the LLVM linked must have.
boards = ["codegen", "elya-codegen/boards"]
